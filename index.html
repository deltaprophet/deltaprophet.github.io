<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Pawan Wagh</title>

    <!-- Primary redirect: works with JavaScript disabled. -->
    <meta http-equiv="refresh" content="0; url=https://pawanwagh.me/">
    <link rel="canonical" href="https://pawanwagh.me/">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Pawan Wagh's site has moved to pawanwagh.me">

    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --accent: #ff6719;
            --accent-hover: #ff8042;
            --border: #2a2a2a;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Charter', Georgia, 'Times New Roman', serif;
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            text-align: center;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        h1 {
            font-size: 1.75rem;
            line-height: 1.3;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        a.go {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--bg-primary);
            background-color: var(--accent);
            border-radius: 6px;
            text-decoration: none;
        }

        a.go:hover {
            background-color: var(--accent-hover);
        }

        a.go:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>

</head>

<body>

    <div class="card">
        <h1>This site has moved</h1>
        <p>Pawan Wagh&rsquo;s site now lives at <strong>pawanwagh.me</strong>. You should be redirected automatically.</p>
        <a class="go" href="https://pawanwagh.me/">Go to pawanwagh.me</a>
    </div>

    <script>
        // Fires immediately; replace() keeps this stub out of the back-button
        // history, so "back" returns the visitor to wherever they came from.
        window.location.replace("https://pawanwagh.me/");
    </script>

</body>

</html>
